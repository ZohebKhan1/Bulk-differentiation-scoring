<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
  <title id="title">Reference trajectory and sample scoring</title>
  <desc id="desc">Temporal genes and reference samples define a PCA reference space, timepoint means define a trajectory, and new samples are projected to return predicted time, score, and squared distance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <rect x="55" y="26" width="280" height="82" fill="#e7f4ec" stroke="#28734d" stroke-width="2"/>
    <text x="195" y="59" fill="#111827"><tspan x="195" dy="0">Temporal genes</tspan><tspan x="195" dy="26">Selected from reference</tspan></text>

    <rect x="565" y="26" width="280" height="82" fill="#eef5fb" stroke="#185f8a" stroke-width="2"/>
    <text x="705" y="59" fill="#111827"><tspan x="705" dy="0">Reference samples</tspan><tspan x="705" dy="26">Known timepoints</tspan></text>

    <line x1="195" y1="108" x2="355" y2="140" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="705" y1="108" x2="545" y2="140" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="260" y="142" width="380" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="450" y="175" fill="#111827"><tspan x="450" dy="0">Reference PCA</tspan><tspan x="450" dy="26">Centered, unscaled</tspan></text>

    <line x1="450" y1="224" x2="450" y2="254" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="260" y="256" width="380" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="450" y="289" fill="#111827"><tspan x="450" dy="0">Timepoint means</tspan><tspan x="450" dy="26">One mean per timepoint</tspan></text>

    <line x1="450" y1="338" x2="450" y2="368" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="260" y="370" width="380" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="450" y="403" fill="#111827"><tspan x="450" dy="0">Reference trajectory</tspan><tspan x="450" dy="26">Connect ordered means</tspan></text>

    <line x1="450" y1="452" x2="450" y2="482" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="260" y="484" width="380" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="450" y="517" fill="#111827"><tspan x="450" dy="0">Project samples</tspan><tspan x="450" dy="26">Map samples to trajectory</tspan></text>

    <line x1="450" y1="566" x2="450" y2="596" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="235" y="598" width="430" height="92" fill="#fff4df" stroke="#a66a00" stroke-width="2"/>
    <text x="450" y="631" fill="#111827"><tspan x="450" dy="0">Predicted time · score</tspan><tspan x="450" dy="26">Squared distance</tspan></text>
  </g>
</svg>
