<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">Temporal gene selection</title>
  <desc id="desc">Reference counts and metadata pass through an expression filter, a DESeq2 likelihood-ratio test, and a VST range filter to produce temporal genes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <rect x="150" y="20" width="460" height="78" fill="#eef5fb" stroke="#185f8a" stroke-width="2"/>
    <text x="380" y="51" fill="#111827"><tspan x="380" dy="0">Reference counts</tspan><tspan x="380" dy="25">and sample metadata</tspan></text>

    <line x1="380" y1="98" x2="380" y2="128" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="150" y="130" width="460" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="380" y="163" fill="#111827"><tspan x="380" dy="0">Expression filter</tspan><tspan x="380" dy="26">Keep sufficiently expressed genes</tspan></text>

    <line x1="380" y1="212" x2="380" y2="242" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="150" y="244" width="460" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="380" y="277" fill="#111827"><tspan x="380" dy="0">DESeq2 LRT</tspan><tspan x="380" dy="26">Test time, with covariates</tspan></text>

    <line x1="380" y1="326" x2="380" y2="356" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="150" y="358" width="460" height="82" fill="#f8fafc" stroke="#185f8a" stroke-width="2"/>
    <text x="380" y="391" fill="#111827"><tspan x="380" dy="0">VST range filter</tspan><tspan x="380" dy="26">Keep time-varying genes</tspan></text>

    <line x1="380" y1="440" x2="380" y2="470" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="150" y="472" width="460" height="82" fill="#e7f4ec" stroke="#28734d" stroke-width="2"/>
    <text x="380" y="505" fill="#111827"><tspan x="380" dy="0">Temporal genes</tspan><tspan x="380" dy="26">Used for PCA and scoring</tspan></text>
  </g>
</svg>
