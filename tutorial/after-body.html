<script>
  document.addEventListener("DOMContentLoaded", function () {
    document
      .querySelectorAll('.page-inner a[href^="http"]')
      .forEach(function (link) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });

    const codeBlocks = Array.from(
      document.querySelectorAll("div.sourceCode, pre.sourceCode")
    ).filter(function (block) {
      return !block.closest("details.code-fold") &&
        !(block.tagName === "PRE" && block.closest("div.sourceCode"));
    });

    codeBlocks.forEach(function (block) {
      const details = document.createElement("details");
      details.className = "code-fold";
      details.open = true;

      const summary = document.createElement("summary");
      summary.textContent = "Code";

      block.parentNode.insertBefore(details, block);
      details.appendChild(summary);
      details.appendChild(block);
    });
  });
</script>
