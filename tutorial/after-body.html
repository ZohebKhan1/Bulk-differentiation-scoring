<script>
  document.addEventListener("DOMContentLoaded", function () {
    document
      .querySelectorAll('.page-inner a[href^="http"]')
      .forEach(function (link) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });

  });
</script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "strict",
    theme: "base",
    themeVariables: {
      fontFamily: '"Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif',
      fontSize: "13px",
      primaryColor: "#eef5fb",
      primaryTextColor: "#111827",
      primaryBorderColor: "#185f8a",
      lineColor: "#64748b"
    },
    flowchart: {
      curve: "linear",
      nodeSpacing: 24,
      rankSpacing: 54,
      useMaxWidth: true
    }
  });
</script>
