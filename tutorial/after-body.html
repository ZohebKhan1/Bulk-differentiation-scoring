<script>
  document.addEventListener("DOMContentLoaded", function () {
    document
      .querySelectorAll('.page-inner a[href^="http"]')
      .forEach(function (link) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });

    const codeBlocks = Array.from(
      document.querySelectorAll("div.sourceCode, pre.sourceCode")
    ).filter(function (block) {
      return !block.closest("details.code-fold") &&
        !(block.tagName === "PRE" && block.closest("div.sourceCode"));
    });

    codeBlocks.forEach(function (block) {
      const details = document.createElement("details");
      details.className = "code-fold";
      details.open = true;

      const summary = document.createElement("summary");
      summary.textContent = "Code";

      block.parentNode.insertBefore(details, block);
      details.appendChild(summary);
      details.appendChild(block);
    });
  });
</script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "strict",
    theme: "base",
    themeVariables: {
      fontFamily: '"Latin Modern Sans", "Helvetica Neue", Helvetica, Arial, sans-serif',
      fontSize: "16px",
      primaryColor: "#eef5fb",
      primaryTextColor: "#111827",
      primaryBorderColor: "#185f8a",
      lineColor: "#64748b"
    },
    flowchart: {
      curve: "linear",
      nodeSpacing: 24,
      rankSpacing: 28,
      useMaxWidth: true
    }
  });
</script>
